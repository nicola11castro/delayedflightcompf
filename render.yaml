services:
  - type: web
    name: flightclaim-pro
    runtime: node
    plan: starter
    # Render skips devDependencies when NODE_ENV=production, but the build needs them.
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flightclaim-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: AIRLINE_CLAIMS_EMAIL
        sync: false

databases:
  - name: flightclaim-db
    databaseName: flightclaim
    user: flightclaim_user
    plan: starter
